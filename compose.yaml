services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data
    networks:
      - database
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      # This is a path only. The bootstrap container writes the local development
      # token to the named volume; a production deployment replaces it with an
      # platform-managed secret at the same path.
      FORGEJO_API_TOKEN_FILE: /run/secrets/forgejo_api_token
      SENTINEL_SECRET_DIRECTORY: /run/sentinel-secrets
      SENTINEL_MANAGED_SSH_KEY_DIRECTORY: /var/lib/sentinel/managed-ssh
      SENTINEL_SSH_KNOWN_HOSTS_FILE: /run/sentinel-secrets/known_hosts
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: /grafana
      GRAFANA_API_TOKEN_FILE: /run/grafana-service-credentials/grafana_api_token
    depends_on:
      postgres:
        condition: service_healthy
      forgejo-bootstrap:
        condition: service_completed_successfully
      sentinel-managed-ssh-init:
        condition: service_completed_successfully
    networks:
      - application
      - database
      - playbooks
      - collection
    volumes:
      - forgejo-service-credentials:/run/secrets:ro
      - ./secrets:/run/sentinel-secrets:ro
      - sentinel-managed-ssh:/var/lib/sentinel/managed-ssh
      - grafana-service-credentials:/run/grafana-service-credentials:ro
    restart: unless-stopped

  # The worker is part of the same Sentinel modular monolith. It is the sole
  # scheduler authority and owns read-only collection execution.
  worker:
    build:
      context: ./backend
    command: ["python", "-m", "sentinel.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      FORGEJO_API_TOKEN_FILE: /run/secrets/forgejo_api_token
      SENTINEL_SECRET_DIRECTORY: /run/sentinel-secrets
      SENTINEL_MANAGED_SSH_KEY_DIRECTORY: /var/lib/sentinel/managed-ssh
      SENTINEL_ARTIFACT_DIRECTORY: /var/lib/sentinel/artifacts
      SENTINEL_SSH_KNOWN_HOSTS_FILE: /run/sentinel-secrets/known_hosts
    depends_on:
      postgres:
        condition: service_healthy
      forgejo-bootstrap:
        condition: service_completed_successfully
      sentinel-storage-init:
        condition: service_completed_successfully
      sentinel-managed-ssh-init:
        condition: service_completed_successfully
    networks:
      - database
      - playbooks
      - collection
    volumes:
      - forgejo-service-credentials:/run/secrets:ro
      - ./secrets:/run/sentinel-secrets:ro
      - sentinel-managed-ssh:/var/lib/sentinel/managed-ssh:ro
      - sentinel-artifacts:/var/lib/sentinel/artifacts
    restart: unless-stopped

  sentinel-storage-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /var/lib/sentinel/artifacts
        chown -R 1000:1000 /var/lib/sentinel
        chmod 700 /var/lib/sentinel /var/lib/sentinel/artifacts
    volumes:
      - sentinel-artifacts:/var/lib/sentinel/artifacts
    restart: "no"

  sentinel-managed-ssh-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown 1000:1000 /var/lib/sentinel/managed-ssh
        chmod 700 /var/lib/sentinel/managed-ssh
    volumes:
      - sentinel-managed-ssh:/var/lib/sentinel/managed-ssh
    restart: "no"

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.5-rootless
    user: "1000:1000"
    environment:
      FORGEJO____APP_NAME: Sentinel Playbooks
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: "private"
    volumes:
      - forgejo-data:/var/lib/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - playbooks
    restart: unless-stopped

  forgejo-bootstrap:
    image: codeberg.org/forgejo/forgejo:16.0.5-rootless
    user: "1000:1000"
    depends_on:
      forgejo:
        condition: service_healthy
      forgejo-credentials-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-service-credentials:/run/sentinel-forgejo-credentials
      - ./forgejo/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    networks:
      - playbooks
    restart: "no"

  # Docker creates named volumes as root-owned. This one-shot job prepares the
  # local development credential volume for Forgejo's rootless UID without
  # giving the application write access to the secret mount.
  forgejo-credentials-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/sentinel-forgejo-credentials
        chown 1000:1000 /run/sentinel-forgejo-credentials
        chmod 700 /run/sentinel-forgejo-credentials
    volumes:
      - forgejo-service-credentials:/run/sentinel-forgejo-credentials
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
      grafana-bootstrap:
        condition: service_completed_successfully
    networks:
      - application
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
    restart: unless-stopped

  # Grafana owns analytical dashboard composition. It reads only the curated
  # reporting schema through a dedicated read-only PostgreSQL role.
  grafana-db-init:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-sentinel_db}
      PGUSER: ${POSTGRES_USER:-sentinel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GRAFANA_CONFIG_DB_PASSWORD: ${GRAFANA_CONFIG_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      GRAFANA_REPORTING_DB_PASSWORD: ${GRAFANA_REPORTING_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
    depends_on:
      api:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until psql -Atqc "SELECT to_regclass('reporting.collection_runs') IS NOT NULL" | grep -qx t; do sleep 2; done
        if psql -d postgres -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'grafana_config'" | grep -qx 1; then
          psql -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE grafana_config LOGIN PASSWORD '$$GRAFANA_CONFIG_DB_PASSWORD';"
        else
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE grafana_config LOGIN PASSWORD '$$GRAFANA_CONFIG_DB_PASSWORD';"
        fi
        if ! psql -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname = 'grafana_db'" | grep -qx 1; then
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE grafana_db OWNER grafana_config;"
        fi
        if psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'grafana_reader'" | grep -qx 1; then
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE grafana_reader LOGIN PASSWORD '$$GRAFANA_REPORTING_DB_PASSWORD';"
        else
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE grafana_reader LOGIN PASSWORD '$$GRAFANA_REPORTING_DB_PASSWORD';"
        fi
        psql -v ON_ERROR_STOP=1 <<'SQL'
        GRANT CONNECT ON DATABASE sentinel_db TO grafana_reader;
        GRANT USAGE ON SCHEMA reporting TO grafana_reader;
        GRANT SELECT ON ALL TABLES IN SCHEMA reporting TO grafana_reader;
        ALTER DEFAULT PRIVILEGES IN SCHEMA reporting GRANT SELECT ON TABLES TO grafana_reader;
        SQL
    networks:
      - database
    restart: "no"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana_db
      GF_DATABASE_USER: grafana_config
      GF_DATABASE_PASSWORD: ${GRAFANA_CONFIG_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      GF_DATABASE_SSL_MODE: disable
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GRAFANA_REPORTING_DB_PASSWORD: ${GRAFANA_REPORTING_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - application
      - database
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  grafana-credentials-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/grafana-service-credentials
        chown 1000:1000 /run/grafana-service-credentials
        chmod 700 /run/grafana-service-credentials
    volumes:
      - grafana-service-credentials:/run/grafana-service-credentials
    restart: "no"

  grafana-bootstrap:
    build:
      context: ./grafana
    user: "1000:1000"
    entrypoint: ["/bootstrap/bootstrap.sh"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local}
      GRAFANA_API_TOKEN_FILE: /run/grafana-service-credentials/grafana_api_token
    depends_on:
      grafana:
        condition: service_healthy
      grafana-credentials-init:
        condition: service_completed_successfully
    volumes:
      - grafana-service-credentials:/run/grafana-service-credentials
    networks:
      - application
    restart: "no"

volumes:
  sentinel-postgres-data:
  forgejo-data:
  # Local development credential material generated during Forgejo bootstrap.
  # It is not a source-controlled file and is mounted read-only by the API.
  forgejo-service-credentials:
  sentinel-artifacts:
  sentinel-managed-ssh:
  grafana-data:
  grafana-service-credentials:

networks:
  application:
  database:
    internal: true
  playbooks:
    internal: true
  # API and worker only: this permits approved target-network routes while the
  # database and Forgejo networks remain private.
  collection:
