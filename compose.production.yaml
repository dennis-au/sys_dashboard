name: sentinel

x-log-options: &log-options
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-backend: &backend
  image: sentinel-api:${SENTINEL_IMAGE_TAG:-production}
  build:
    context: ./backend
  restart: unless-stopped
  init: true
  environment:
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: ${POSTGRES_DB:-sentinel_db}
    DATABASE_USER: ${POSTGRES_USER:-sentinel}
    DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    FORGEJO_API_TOKEN_FILE: /run/forgejo-service-credentials/forgejo_api_token
    SENTINEL_SECRET_DIRECTORY: /run/sentinel-secrets
    SENTINEL_MANAGED_SSH_KEY_DIRECTORY: /var/lib/sentinel/managed-ssh
    SENTINEL_ARTIFACT_DIRECTORY: /var/lib/sentinel/artifacts
    SENTINEL_SSH_KNOWN_HOSTS_FILE: /run/sentinel-secrets/known_hosts
    GRAFANA_URL: http://grafana:3000
    GRAFANA_PUBLIC_URL: /grafana
    GRAFANA_API_TOKEN_FILE: /run/grafana-service-credentials/grafana_api_token
    GRAFANA_ADMIN_PASSWORD_FILE: /run/grafana-admin-credentials/admin_password
    HOME: /tmp
    XDG_CACHE_HOME: /tmp/.cache
  secrets:
    - postgres_password
  volumes:
    - forgejo-service-credentials:/run/forgejo-service-credentials:ro
    - ${SENTINEL_RUNTIME_DIR:?Run scripts/deploy-production first}/secrets:/run/sentinel-secrets:ro
    - grafana-service-credentials:/run/grafana-service-credentials:ro
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *log-options

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data
    networks:
      - database
    logging: *log-options

  api:
    <<: *backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      forgejo-bootstrap:
        condition: service_completed_successfully
      sentinel-managed-ssh-init:
        condition: service_completed_successfully
      grafana-admin-credentials-init:
        condition: service_completed_successfully
    networks:
      - application
      - database
      - playbooks
      - collection
    volumes:
      - forgejo-service-credentials:/run/forgejo-service-credentials:ro
      - ${SENTINEL_RUNTIME_DIR:?Run scripts/deploy-production first}/secrets:/run/sentinel-secrets:ro
      - sentinel-managed-ssh:/var/lib/sentinel/managed-ssh
      - grafana-service-credentials:/run/grafana-service-credentials:ro
      - grafana-admin-credentials:/run/grafana-admin-credentials
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    image: sentinel-worker:${SENTINEL_IMAGE_TAG:-production}
    command: ["python", "-m", "sentinel.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      forgejo-bootstrap:
        condition: service_completed_successfully
      sentinel-storage-init:
        condition: service_completed_successfully
      sentinel-managed-ssh-init:
        condition: service_completed_successfully
    networks:
      - database
      - playbooks
      - collection
    volumes:
      - forgejo-service-credentials:/run/forgejo-service-credentials:ro
      - ${SENTINEL_RUNTIME_DIR:?Run scripts/deploy-production first}/secrets:/run/sentinel-secrets:ro
      - sentinel-managed-ssh:/var/lib/sentinel/managed-ssh:ro
      - sentinel-artifacts:/var/lib/sentinel/artifacts
      - grafana-service-credentials:/run/grafana-service-credentials:ro

  sentinel-storage-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /var/lib/sentinel/artifacts
        chown -R 1000:1000 /var/lib/sentinel
        chmod 700 /var/lib/sentinel /var/lib/sentinel/artifacts
    volumes:
      - sentinel-artifacts:/var/lib/sentinel/artifacts
    restart: "no"
    logging: *log-options

  sentinel-managed-ssh-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown 1000:1000 /var/lib/sentinel/managed-ssh
        chmod 700 /var/lib/sentinel/managed-ssh
    volumes:
      - sentinel-managed-ssh:/var/lib/sentinel/managed-ssh
    restart: "no"
    logging: *log-options

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.5-rootless
    user: "1000:1000"
    restart: unless-stopped
    environment:
      FORGEJO____APP_NAME: Sentinel Playbooks
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: "private"
    volumes:
      - forgejo-data:/var/lib/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - playbooks
    logging: *log-options

  forgejo-credentials-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/sentinel-forgejo-credentials
        chown 1000:1000 /run/sentinel-forgejo-credentials
        chmod 700 /run/sentinel-forgejo-credentials
    volumes:
      - forgejo-service-credentials:/run/sentinel-forgejo-credentials
    restart: "no"
    logging: *log-options

  forgejo-bootstrap:
    image: sentinel-forgejo-bootstrap:${SENTINEL_IMAGE_TAG:-production}
    build:
      context: ./forgejo
    user: "1000:1000"
    depends_on:
      forgejo:
        condition: service_healthy
      forgejo-credentials-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-service-credentials:/run/sentinel-forgejo-credentials
    networks:
      - playbooks
    restart: "no"
    logging: *log-options

  dashboard:
    image: sentinel-dashboard:${SENTINEL_IMAGE_TAG:-production}
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
      grafana-bootstrap:
        condition: service_completed_successfully
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *log-options

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    init: true
    depends_on:
      dashboard:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SENTINEL_RUNTIME_DIR:?Run scripts/deploy-production first}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *log-options

  # Grafana owns dashboard composition. It is reachable through the dashboard
  # reverse proxy only; the host does not publish Grafana's native port.
  grafana-db-init:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-sentinel_db}
      PGUSER: ${POSTGRES_USER:-sentinel}
      GRAFANA_CONFIG_DB_PASSWORD: ${GRAFANA_CONFIG_DB_PASSWORD:?Set GRAFANA_CONFIG_DB_PASSWORD in deployment.env}
      GRAFANA_REPORTING_DB_PASSWORD: ${GRAFANA_REPORTING_DB_PASSWORD:?Set GRAFANA_REPORTING_DB_PASSWORD in deployment.env}
    secrets:
      - postgres_password
    depends_on:
      api:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        test -n "$$PGPASSWORD"
        until psql -Atqc "SELECT to_regclass('reporting.collection_runs') IS NOT NULL" | grep -qx t; do sleep 2; done
        if psql -d postgres -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'grafana_config'" | grep -qx 1; then
          psql -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE grafana_config LOGIN PASSWORD '$$GRAFANA_CONFIG_DB_PASSWORD';"
        else
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE grafana_config LOGIN PASSWORD '$$GRAFANA_CONFIG_DB_PASSWORD';"
        fi
        if ! psql -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname = 'grafana_db'" | grep -qx 1; then
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE grafana_db OWNER grafana_config;"
        fi
        if psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'grafana_reader'" | grep -qx 1; then
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE grafana_reader LOGIN PASSWORD '$$GRAFANA_REPORTING_DB_PASSWORD';"
        else
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE grafana_reader LOGIN PASSWORD '$$GRAFANA_REPORTING_DB_PASSWORD';"
        fi
        psql -v ON_ERROR_STOP=1 <<'SQL'
        GRANT CONNECT ON DATABASE sentinel_db TO grafana_reader;
        GRANT USAGE ON SCHEMA reporting TO grafana_reader;
        GRANT SELECT ON ALL TABLES IN SCHEMA reporting TO grafana_reader;
        ALTER DEFAULT PRIVILEGES IN SCHEMA reporting GRANT SELECT ON TABLES TO grafana_reader;
        SQL
    networks:
      - database
    restart: "no"
    logging: *log-options

  # Seed a private runtime credential once. Sentinel replaces this file only
  # after a Settings-driven Grafana administrator password reset.
  grafana-admin-credentials-init:
    image: alpine:3.22
    user: "0:0"
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        credential_file=/run/grafana-admin-credentials/admin_password
        chown 1000:1000 /run/grafana-admin-credentials
        chmod 755 /run/grafana-admin-credentials
        if [ ! -s "$$credential_file" ]; then
          test -n "$$GRAFANA_ADMIN_PASSWORD"
          umask 077
          printf '%s' "$$GRAFANA_ADMIN_PASSWORD" > "$$credential_file"
        fi
        chown 1000:1000 "$$credential_file"
        chmod 644 "$$credential_file"
    volumes:
      - grafana-admin-credentials:/run/grafana-admin-credentials
    restart: "no"
    logging: *log-options

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/grafana-admin-credentials/admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana_db
      GF_DATABASE_USER: grafana_config
      GF_DATABASE_PASSWORD: ${GRAFANA_CONFIG_DB_PASSWORD:?Set GRAFANA_CONFIG_DB_PASSWORD in deployment.env}
      GF_DATABASE_SSL_MODE: disable
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${SENTINEL_DOMAIN}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
      grafana-admin-credentials-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - application
      - database
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-admin-credentials:/run/grafana-admin-credentials:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    logging: *log-options

  grafana-credentials-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/grafana-service-credentials
        chown 1000:1000 /run/grafana-service-credentials
        chmod 700 /run/grafana-service-credentials
    volumes:
      - grafana-service-credentials:/run/grafana-service-credentials
    restart: "no"
    logging: *log-options

  grafana-bootstrap:
    image: sentinel-grafana-bootstrap:${SENTINEL_IMAGE_TAG:-production}
    build:
      context: ./grafana
    user: "1000:1000"
    entrypoint: ["/bootstrap/bootstrap.sh"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD_FILE: /run/grafana-admin-credentials/admin_password
      GRAFANA_API_TOKEN_FILE: /run/grafana-service-credentials/grafana_api_token
    depends_on:
      grafana:
        condition: service_healthy
      grafana-credentials-init:
        condition: service_completed_successfully
      grafana-admin-credentials-init:
        condition: service_completed_successfully
    volumes:
      - grafana-service-credentials:/run/grafana-service-credentials
      - grafana-admin-credentials:/run/grafana-admin-credentials:ro
    networks:
      - application
    restart: "no"
    logging: *log-options

secrets:
  postgres_password:
    file: ${SENTINEL_RUNTIME_DIR:?Run scripts/deploy-production first}/postgres_password

volumes:
  sentinel-postgres-data:
  forgejo-data:
  forgejo-service-credentials:
  sentinel-artifacts:
  sentinel-managed-ssh:
  grafana-data:
  grafana-service-credentials:
  grafana-admin-credentials:
  caddy-data:
  caddy-config:

networks:
  application:
  database:
    internal: true
  playbooks:
    internal: true
  collection:
