apiVersion: 1

datasources:
  - name: Sentinel reporting
    uid: sentinel-reporting
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: sentinel_db
      sslmode: disable
      postgresVersion: 17
      timescaledb: false
      schema: reporting
    secureJsonData:
      password: ${GRAFANA_REPORTING_DB_PASSWORD}
